name: Sync Composer Lock

on:
  push:
    branches:
      - main
    paths:
      - composer.json

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Update Pulse in lock file
        run: composer update laravel/pulse --with-all-dependencies --no-interaction --prefer-dist --no-scripts

      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: atualizar composer.lock para Laravel Pulse"
          git push origin main
