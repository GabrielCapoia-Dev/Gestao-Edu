name: gestao-edu-2
services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?configure MYSQL_DATABASE in .env}
      DB_USER: ${MYSQL_USER:?configure MYSQL_USER in .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?configure MYSQL_PASSWORD in .env}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?configure REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${API_PORT:-3030}:3000"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [ge2-private, ge2-egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?configure MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?configure MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?configure MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?configure MYSQL_ROOT_PASSWORD in .env}
    volumes: [ge2-mysql:/var/lib/mysql]
    networks: [ge2-private]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?configure REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?configure REDIS_PASSWORD in .env}
    volumes: [ge2-redis:/data]
    networks: [ge2-private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  ge2-private:
    name: gestao-edu-2-private
    driver: bridge
    internal: true
  ge2-egress:
    name: gestao-edu-2-egress
    driver: bridge

volumes:
  ge2-mysql:
    name: gestao-edu-2-mysql
  ge2-redis:
    name: gestao-edu-2-redis
