log_format performance '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 80;
    server_name __NGINX_SERVER_NAME__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __NGINX_SERVER_NAME__;

    root /var/www/public;
    index index.php;
    add_header X-Robots-Tag "__NGINX_ROBOTS_POLICY__" always;
    ssl_certificate __NGINX_SSL_CERTIFICATE__;
    ssl_certificate_key __NGINX_SSL_CERTIFICATE_KEY__;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    etag on;
    if_modified_since exact;
    access_log /var/log/nginx/access.log performance buffer=64k flush=5s;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_http_version 1.1;
    gzip_proxied any;
    gzip_static on;
    gzip_buffers 16 8k;
    gzip_disable "msie6";
    gzip_types text/plain text/css text/javascript application/javascript
        application/x-javascript application/json application/xml
        application/xml+rss image/svg+xml application/xhtml+xml
        application/activity+json application/ld+json font/woff2 font/ttf
        application/vnd.ms-fontobject;

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /vendor/livewire/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/livewire(?:-[^/]+)?/livewire(?:\.csp)?(?:\.min)?\.js(?:\.map)?$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @octane;
    }

    location ~* \.(?:css|js|woff2|woff|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # The document root is a Laravel route. Send it directly to Octane so Nginx
    # never resolves the physical public/index.php file as a static download.
    location = / {
        try_files /not_exists @octane;
    }

    # Octane does not need a public front-controller URL. Keep direct requests
    # from exposing the PHP source or reaching the application as /index.php.
    location = /index.php {
        return 404;
    }

    # Prevent any future PHP file under public/ from being exposed as source.
    location ~* \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ @octane;
    }

    location @octane {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 32k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ /\.ht {
        deny all;
    }
}
