server {
    listen 80;
    server_name edu.hubdetestes.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edu.hubdetestes.online;

    root /var/www/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/edu.hubdetestes.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edu.hubdetestes.online/privkey.pem;

    sendfile on;
    tcp_nopush on;
    etag on;
    if_modified_since exact;

    # Cache metadata and file descriptors in Nginx. File contents are still
    # served by the filesystem/OS page cache without going through PHP.
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Compress text responses, especially Filament/Livewire CSS and JS.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_http_version 1.1;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Service workers must revalidate, otherwise PWA updates can get stuck.
    location = /mobile-sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /mobile.webmanifest {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Hashed Vite assets can be cached aggressively.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Livewire serves this JS through Laravel, but the URL is versioned.
    location ~* ^/livewire(?:-[^/]+)?/livewire\.js$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Static files only. Do not fallback to Laravel here, otherwise HTML/404
    # responses for missing .css/.js paths may be cached as static assets.
    location ~* \.(?:css|js|woff2|woff|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Required so Laravel resolves the request as HTTPS.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~ /\.ht {
        deny all;
    }
}
