x-production-env: &production-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_LEVEL: warning
  CACHE_DRIVER: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: default
  SESSION_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_CONNECTION: default
  REDIS_QUEUE_RETRY_AFTER: 2100
  PERMISSION_CACHE_STORE: redis
  PERF_HEARTBEAT_INTERVAL: 45
  PERF_PRESENCE_TOUCH_MIN_INTERVAL: 35
  PERF_POLL_ONLINE_USERS: 45
  PERF_POLL_EXPORTS_TABLE: 30
  PERF_POLL_EXPORTS_AUTO_DOWNLOAD: 20
  PERF_CACHE_ONLINE_USERS: 30
  PERF_CACHE_ONLINE_COUNT: 30
  PERF_CACHE_USERS_COUNT: 300
  PERF_CACHE_NOTIFICATION_FORM_OPTIONS: 600
  PERF_CACHE_ACTIVE_EXPORTS: 30

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app-gestao-edu
    container_name: laravel-app-gestao-edu
    restart: unless-stopped
    init: true
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *production-env
    ports:
      - "${DOCKER_HTTP_PORT}:80"
      - "${DOCKER_HTTPS_PORT}:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "test -s /var/www/bootstrap/cache/runtime-ready && test -s /var/www/bootstrap/cache/routes-v7.php && test -s /var/www/bootstrap/cache/config.php" ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 900s
    networks:
      - laravel_gestao-edu

  cron:
    image: laravel-app-gestao-edu
    container_name: laravel-cron-gestao-edu
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *production-env
    entrypoint: []
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - .:/var/www
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - laravel_gestao-edu

  queue-notifications:
    image: laravel-app-gestao-edu
    container_name: laravel-queue-notifications-gestao-edu
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *production-env
    entrypoint: []
    init: true
    command: ["bash", "/var/www/entrypoint.sh", "queue-worker", "notifications"]
    volumes:
      - .:/var/www
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: "${NOTIFICATIONS_QUEUE_CPUS:-0.25}"
    mem_limit: "512m"
    restart: unless-stopped
    stop_grace_period: 90s
    networks:
      - laravel_gestao-edu

  queue:
    image: laravel-app-gestao-edu
    container_name: laravel-queue-gestao-edu
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *production-env
    entrypoint: []
    init: true
    command: ["bash", "/var/www/entrypoint.sh", "queue-worker", "exports"]
    volumes:
      - .:/var/www
    depends_on:
      app:
        # O worker já aguarda bootstrap/cache/runtime-ready no entrypoint.
        # Iniciá-lo junto do app evita que permaneça apenas como "Created"
        # quando o healthcheck do app falha durante um deploy.
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: "${EXPORTS_QUEUE_CPUS:-0.50}"
    mem_limit: "${EXPORTS_QUEUE_MEM_LIMIT:-768m}"
    restart: unless-stopped
    stop_grace_period: 930s
    networks:
      - laravel_gestao-edu

  queue-imports:
    image: laravel-app-gestao-edu
    container_name: laravel-queue-imports-gestao-edu
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *production-env
    entrypoint: []
    init: true
    command: ["bash", "/var/www/entrypoint.sh", "queue-worker", "imports"]
    volumes:
      - .:/var/www
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: "${IMPORTS_QUEUE_CPUS:-0.50}"
    mem_limit: "${IMPORTS_QUEUE_MEM_LIMIT:-768m}"
    restart: unless-stopped
    stop_grace_period: 1830s
    networks:
      - laravel_gestao-edu

  queue-default:
    image: laravel-app-gestao-edu
    container_name: laravel-queue-default-gestao-edu
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *production-env
    entrypoint: []
    init: true
    command: ["bash", "/var/www/entrypoint.sh", "queue-worker", "default"]
    volumes:
      - .:/var/www
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: "${DEFAULT_QUEUE_CPUS:-0.25}"
    mem_limit: "${DEFAULT_QUEUE_MEM_LIMIT:-512m}"
    restart: unless-stopped
    stop_grace_period: 330s
    networks:
      - laravel_gestao-edu

  db:
    image: mysql:8.0
    container_name: laravel-db-gestao-edu
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db_data:/var/lib/mysql
    ports:
      - "${DOCKER_DB_PORT}:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - laravel_gestao-edu

  redis:
    image: redis:7-alpine
    container_name: laravel-redis-gestao-edu
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - laravel_gestao-edu

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel-phpmyadmin-gestao-edu
    env_file:
      - .env
    environment:
      PMA_HOST: db
    ports:
      - "${DOCKER_PHPMYADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel_gestao-edu

volumes:
  redis_data:

networks:
  laravel_gestao-edu:
    driver: bridge
