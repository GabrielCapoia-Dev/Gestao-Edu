<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f4c81">
    <title>Offline | Gestao Edu Mobile</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: linear-gradient(160deg, #082f49 0%, #0f4c81 52%, #0f172a 100%);
            color: #ffffff;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        main {
            width: min(100%, 28rem);
            padding: 1.4rem;
            border-radius: 1.4rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(18px);
        }

        h1 {
            margin: 0 0 0.6rem;
            font-size: 1.5rem;
        }

        p {
            margin: 0;
            line-height: 1.7;
            color: rgba(226, 232, 240, 0.92);
        }
    </style>
</head>
<body>
    <main>
        <h1>Sem conexao no momento</h1>
        <p>Reconecte o aparelho para continuar usando o Gestao Edu Mobile. Assim que a internet voltar, abra o app novamente.</p>
    </main>
</body>
</html>
