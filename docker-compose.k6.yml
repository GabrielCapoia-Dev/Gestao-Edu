services:
  influxdb:
    image: influxdb:1.8-alpine
    container_name: gestao-edu-k6-influxdb
    environment:
      INFLUXDB_DB: k6
    ports:
      - "${K6_INFLUXDB_PORT:-8086}:8086"
    volumes:
      - k6_influxdb_data:/var/lib/influxdb
    networks:
      - gestao_edu_k6

  grafana:
    image: grafana/grafana:latest
    container_name: gestao-edu-k6-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${K6_GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${K6_GRAFANA_PASSWORD:-admin}"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "${K6_GRAFANA_PORT:-3001}:3000"
    volumes:
      - k6_grafana_data:/var/lib/grafana
      - ./load-tests/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./load-tests/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb
    networks:
      - gestao_edu_k6

  k6:
    image: grafana/k6:latest
    container_name: gestao-edu-k6-runner
    profiles:
      - test
    environment:
      K6_BASE_URL: "${K6_BASE_URL:-https://edu.hubdetestes.online}"
      K6_USERS_FILE: "${K6_USERS_FILE:-/scripts/data/users.local.csv}"
      K6_PROFILE: "${K6_PROFILE:-smoke}"
      K6_NAV_PATHS: "${K6_NAV_PATHS:-}"
      K6_PROFILE_PATHS: "${K6_PROFILE_PATHS:-}"
      K6_INCLUDE_HEARTBEAT: "${K6_INCLUDE_HEARTBEAT:-false}"
      K6_PAGE_DELAY_MIN: "${K6_PAGE_DELAY_MIN:-1}"
      K6_PAGE_DELAY_MAX: "${K6_PAGE_DELAY_MAX:-4}"
      K6_OUT: "${K6_OUT:-influxdb=http://influxdb:8086/k6}"
    volumes:
      - ./load-tests:/scripts:ro
      - ./load-tests/results:/results
    working_dir: /scripts
    depends_on:
      - influxdb
    networks:
      - gestao_edu_k6
    command:
      - run
      - scenarios/navigation.js

volumes:
  k6_influxdb_data:
  k6_grafana_data:

networks:
  gestao_edu_k6:
    driver: bridge
